<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="环球优选：工厂直供跨境出口产品目录 + 跨境电商实战培训与在线测验门户">
<title>环球优选 · 跨境出口门户</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312507a'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23ff7a1a' stroke-width='7'/%3E%3Ccircle cx='44' cy='20' r='7' fill='%23ff7a1a'/%3E%3C/svg%3E">
<style>/* ============ 环球优选 · 跨境出口门户 ============ */
:root{
  --pri:#12507a; --pri-d:#0d3d5e; --pri-l:#e8f1f8;
  --acc:#ff7a1a; --acc-d:#e5660d; --acc-l:#fff3e8;
  --bg:#f5f7fa; --card:#ffffff; --tx:#1c2b36; --tx2:#5a6b7a; --tx3:#8a99a8;
  --line:#e4eaf0; --ok:#2e9e5b; --ok-l:#e8f6ee; --err:#d9534f; --err-l:#fdeaea;
  --rad:12px; --shadow:0 1px 3px rgba(16,42,67,.08),0 4px 14px rgba(16,42,67,.06);
  --shadow-h:0 4px 10px rgba(16,42,67,.12),0 10px 26px rgba(16,42,67,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.boot-loading{padding:120px 0;text-align:center;color:var(--tx3)}

/* ---------- 顶部公告条 ---------- */
#announce{background:linear-gradient(90deg,var(--pri-d),var(--pri));color:#fff;font-size:13px;text-align:center;padding:7px 14px;letter-spacing:.5px}
#announce:empty{display:none}

/* ---------- 头部导航 ---------- */
#site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:26px;height:64px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--pri);position:relative;flex-shrink:0}
.brand-mark::after{content:"";position:absolute;inset:7px;border-radius:50%;border:4px solid var(--acc)}
.brand-name{font-weight:800;font-size:17px;letter-spacing:.3px;color:var(--pri-d)}
.brand-name small{display:block;font-size:10px;font-weight:500;color:var(--tx3);letter-spacing:1.6px}
.nav{display:flex;gap:4px;flex:1}
.nav a{padding:8px 14px;border-radius:8px;font-size:14.5px;color:var(--tx2);font-weight:500;transition:.15s}
.nav a:hover{background:var(--pri-l);color:var(--pri)}
.nav a.on{background:var(--pri-l);color:var(--pri);font-weight:700}
.hd-r{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lang-btn{border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--pri);background:#fff;transition:.15s}
.lang-btn:hover{border-color:var(--pri);background:var(--pri-l)}
.burger{display:none;width:40px;height:40px;border-radius:8px;font-size:20px;color:var(--pri);align-items:center;justify-content:center}
.burger:hover{background:var(--pri-l)}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:10px 20px;font-size:14.5px;font-weight:700;transition:.15s;line-height:1.2}
.btn-pri{background:var(--acc);color:#fff}
.btn-pri:hover{background:var(--acc-d);box-shadow:var(--shadow-h)}
.btn-pri-l{background:var(--pri);color:#fff}
.btn-pri-l:hover{background:var(--pri-d);box-shadow:var(--shadow-h)}
.btn-ghost{border:1.5px solid var(--line);color:var(--tx2);background:#fff}
.btn-ghost:hover{border-color:var(--pri);color:var(--pri);background:var(--pri-l)}
.btn-sm{padding:6px 13px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-block;padding:6px 15px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:13.5px;color:var(--tx2);transition:.15s;font-weight:500}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.tag{display:inline-block;padding:2px 10px;border-radius:6px;background:var(--pri-l);color:var(--pri);font-size:12px;font-weight:600}
.tag-acc{background:var(--acc-l);color:var(--acc-d)}
.sec{padding:56px 0}
.sec-head{text-align:center;margin-bottom:34px}
.sec-head h2{font-size:26px;color:var(--pri-d);letter-spacing:.5px}
.sec-head p{color:var(--tx2);margin-top:8px;font-size:14.5px}
.page-head{background:linear-gradient(135deg,var(--pri-d) 0%,var(--pri) 70%);color:#fff;padding:44px 0 40px}
.page-head h1{font-size:28px;letter-spacing:.5px}
.page-head p{opacity:.85;margin-top:8px;font-size:14.5px}
.crumb{font-size:13px;color:var(--tx3);margin-bottom:14px}
.crumb a{color:var(--tx3)}
.crumb a:hover{color:var(--pri)}
.card{background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow)}
input[type=text],textarea{font-family:inherit;font-size:14px;width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 14px;outline:none;transition:.15s;background:#fff;color:var(--tx)}
input[type=text]:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(18,80,122,.12)}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--tx);color:#fff;padding:10px 22px;border-radius:24px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}

/* ---------- 首页 ---------- */
.hero{background:linear-gradient(135deg,var(--pri-d) 0%,var(--pri) 60%,#1a6a9e 100%);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-140px;top:-140px;width:420px;height:420px;border-radius:50%;border:64px solid rgba(255,122,26,.16)}
.hero::after{content:"";position:absolute;left:-90px;bottom:-160px;width:320px;height:320px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero-in{position:relative;z-index:1;padding:74px 0 66px;max-width:660px}
.hero-badge{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:5px 16px;font-size:13px;letter-spacing:1px;margin-bottom:18px}
.hero h1{font-size:38px;line-height:1.25;letter-spacing:1px}
.hero p{margin:16px 0 28px;font-size:16px;opacity:.88;line-height:1.7}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap}
.hero .btn{padding:12px 26px;font-size:15px}
.stats{position:relative;z-index:1;display:flex;gap:0;border:1px solid rgba(255,255,255,.2);border-radius:14px;overflow:hidden;margin-top:44px;background:rgba(255,255,255,.07);backdrop-filter:blur(4px)}
.stat{flex:1;text-align:center;padding:18px 8px;border-right:1px solid rgba(255,255,255,.14)}
.stat:last-child{border-right:none}
.stat b{font-size:24px;color:#fff;display:block}
.stat b .u{font-size:12px;font-weight:500;margin-left:2px;opacity:.8}
.stat span{font-size:12.5px;opacity:.75}
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.why-card{padding:26px 22px;transition:.2s}
.why-card:hover{box-shadow:var(--shadow-h);transform:translateY(-3px)}
.why-ico{width:46px;height:46px;border-radius:12px;background:var(--pri-l);color:var(--pri);font-size:22px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.why-card h3{font-size:16.5px;color:var(--pri-d);margin-bottom:7px}
.why-card p{font-size:13.5px;color:var(--tx2)}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.cat-card{padding:26px 14px;text-align:center;transition:.2s;display:block}
.cat-card:hover{box-shadow:var(--shadow-h);transform:translateY(-3px);border:1px solid var(--pri-l)}
.cat-ico{font-size:30px;margin-bottom:10px}
.cat-card b{display:block;font-size:15.5px;color:var(--pri-d)}
.cat-card span{font-size:12.5px;color:var(--tx3)}
.cta-band{background:linear-gradient(120deg,var(--acc) 0%,#ff9540 100%);border-radius:16px;color:#fff;padding:34px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.cta-band h3{font-size:21px}
.cta-band p{opacity:.92;font-size:14px;margin-top:5px}
.cta-band .btn{background:#fff;color:var(--acc-d)}

/* ---------- 产品 ---------- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search-box{position:relative;flex:1;min-width:230px;max-width:420px}
.search-box input{padding-left:38px}
.search-box::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.55}
.sort-sel{border:1.5px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13.5px;color:var(--tx2);background:#fff;font-family:inherit;outline:none}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.chips-row + .chips-row{margin-top:-18px}
.grid-prod{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.pcard{overflow:hidden;display:flex;flex-direction:column;transition:.2s;position:relative}
.pcard:hover{box-shadow:var(--shadow-h);transform:translateY(-3px)}
.pimg{position:relative;aspect-ratio:1/1;background:var(--pri-l);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.ptag{position:absolute;top:10px;left:10px;background:var(--acc);color:#fff;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:6px;letter-spacing:1px}
.pbody{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.pcat-line{font-size:12px;color:var(--tx3);margin-bottom:5px}
.pname{font-size:14.5px;font-weight:600;color:var(--tx);line-height:1.45;min-height:42px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pprice{display:flex;align-items:baseline;gap:6px;margin:10px 0 4px}
.pprice b{color:var(--acc-d);font-size:18px}
.pprice span{font-size:11.5px;color:var(--tx3)}
.pmoq{font-size:12.5px;color:var(--tx2)}
.pacts{margin-top:12px;display:flex;gap:8px}
.pacts .btn{flex:1;justify-content:center}
.no-result{text-align:center;padding:70px 0;color:var(--tx3);font-size:15px}
.pager{display:flex;gap:7px;justify-content:center;margin-top:36px;flex-wrap:wrap}
.pager button{min-width:38px;height:38px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--tx2);font-size:14px;font-weight:600;transition:.15s;padding:0 8px}
.pager button:hover{border-color:var(--pri);color:var(--pri)}
.pager button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}
/* 详情页 */
.pd{display:grid;grid-template-columns:460px 1fr;gap:38px;padding:34px;background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow)}
.pd-imgs .main-img{border-radius:10px;overflow:hidden;background:var(--pri-l);aspect-ratio:1/1}
.pd-imgs .main-img img{width:100%;height:100%;object-fit:cover}
.pd-info h1{font-size:23px;line-height:1.4;color:var(--pri-d)}
.pd-meta{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.pd-price-band{background:var(--acc-l);border:1px solid #ffd9b8;border-radius:10px;padding:16px 20px;display:flex;gap:34px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.pd-price-band .lbl{font-size:12px;color:var(--tx2);display:block}
.pd-price-band .val{font-size:24px;font-weight:800;color:var(--acc-d)}
.pd-price-band .val small{font-size:13px;font-weight:500;color:var(--tx2)}
.pd-acts{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.pd-sec{margin-top:26px}
.pd-sec h3{font-size:16px;color:var(--pri-d);margin-bottom:12px;padding-left:10px;border-left:4px solid var(--acc)}
.spec-table{width:100%;border-collapse:collapse;font-size:14px}
.spec-table td{border:1px solid var(--line);padding:9px 14px}
.spec-table td:first-child{background:var(--pri-l);color:var(--pri-d);font-weight:600;width:38%}
.pd-desc{color:var(--tx2);line-height:1.85;white-space:pre-wrap}
.rel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* ---------- 公司介绍 ---------- */
.about-story{padding:36px;background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);font-size:15px;color:var(--tx2);line-height:1.9}
.about-story p+p{margin-top:14px}
.cap-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.cap-card{padding:20px;text-align:center}
.cap-card b{display:block;font-size:15px;color:var(--pri-d);margin-bottom:6px}
.cap-card span{font-size:13px;color:var(--tx2)}
.mile{position:relative;margin-left:10px;padding-left:28px;border-left:2px solid var(--line)}
.mile-item{position:relative;padding-bottom:22px}
.mile-item:last-child{padding-bottom:0}
.mile-item::before{content:"";position:absolute;left:-35px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 0 0 2px var(--acc-l)}
.mile-item b{color:var(--pri-d);margin-right:10px}
.mile-item span{color:var(--tx2);font-size:14.5px}
.compliance-tb{width:100%;border-collapse:collapse;background:var(--card);box-shadow:var(--shadow);border-radius:var(--rad);overflow:hidden;font-size:14px}
.compliance-tb th{background:var(--pri);color:#fff;padding:13px 16px;text-align:left;font-weight:600}
.compliance-tb td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.compliance-tb tr:last-child td{border-bottom:none}
.compliance-tb td:first-child{font-weight:700;color:var(--pri-d);white-space:nowrap}
.compliance-tb .rule-cell{color:var(--acc-d);font-weight:600}
.compliance-note{font-size:12.5px;color:var(--tx3);margin-top:10px}

/* ---------- 课程 ---------- */
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.ccard{padding:24px;display:flex;flex-direction:column;gap:10px;transition:.2s}
.ccard:hover{box-shadow:var(--shadow-h);transform:translateY(-3px)}
.ccard-top{display:flex;gap:8px;align-items:center}
.ccard h3{font-size:17px;color:var(--pri-d);line-height:1.45}
.ccard .csum{font-size:13.5px;color:var(--tx2);flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cmeta{display:flex;gap:14px;font-size:12.5px;color:var(--tx3)}
.ccard-acts{display:flex;gap:10px;margin-top:4px}
.ccard-acts .btn{flex:1;justify-content:center}
.cd-head{padding:32px 36px;border-radius:var(--rad);box-shadow:var(--shadow);display:flex;justify-content:space-between;gap:20px;align-items:flex-start;flex-wrap:wrap}
.cd-head h1{font-size:24px;color:var(--pri-d)}
.cd-head .csum{color:var(--tx2);margin-top:10px;font-size:14.5px}
.chapter{padding:22px 26px;margin-bottom:16px}
.ch-title{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.ch-no{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ch-title b{font-size:15.5px;color:var(--tx)}
.ch-dur{margin-left:auto;font-size:12.5px;color:var(--tx3);background:var(--bg);padding:3px 10px;border-radius:12px}
.video-ph{aspect-ratio:16/9;background:linear-gradient(135deg,#22374a,#123047);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:10px;margin-bottom:14px}
.vp-play{width:62px;height:62px;border-radius:50%;background:rgba(255,122,26,.9);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(255,122,26,.4)}
.video-ph b{font-size:15px;letter-spacing:.5px}
.video-ph span{font-size:12px;opacity:.7}
.ch-points{background:var(--pri-l);border-radius:10px;padding:16px 20px}
.ch-points b{color:var(--pri-d);font-size:13.5px;display:block;margin-bottom:8px}
.ch-points li{list-style:none;font-size:13.5px;color:var(--tx2);padding:3px 0 3px 20px;position:relative}
.ch-points li::before{content:"✓";position:absolute;left:0;color:var(--acc-d);font-weight:700}
.quiz-cta{background:var(--acc-l);border:1.5px dashed var(--acc);border-radius:12px;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:20px}
.quiz-cta span{color:var(--acc-d);font-weight:600;font-size:14.5px}

/* ---------- 测验 ---------- */
.quiz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.qcard{padding:24px;display:flex;flex-direction:column;gap:10px}
.qcard h3{font-size:16.5px;color:var(--pri-d)}
.qcard .qmeta{font-size:12.5px;color:var(--tx3)}
.qcard .qbest{font-size:13px;color:var(--acc-d);font-weight:700}
.qrun-head{background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);padding:20px 26px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.qrun-head h1{font-size:20px;color:var(--pri-d)}
.qprog{font-size:13px;color:var(--tx2)}
.qprog b{color:var(--acc-d)}
.qcard-q{padding:22px 26px;margin-bottom:16px}
.qstem{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.qtype{flex-shrink:0;font-size:12px;font-weight:700;color:#fff;background:var(--pri);border-radius:6px;padding:3px 9px;margin-top:2px}
.qtype.mul{background:#6b5ce7}.qtype.jud{background:#2e9e5b}
.qstem b{font-size:15px;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;font-size:14px;color:var(--tx2);text-align:left;transition:.15s;display:flex;gap:10px;align-items:flex-start;background:#fff;width:100%}
.opt:hover{border-color:var(--pri);background:var(--pri-l)}
.opt.sel{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:600}
.opt .opt-key{font-weight:800;color:var(--pri);flex-shrink:0}
.opt.correct{border-color:var(--ok);background:var(--ok-l);color:#1d6e3e}
.opt.wrong{border-color:var(--err);background:var(--err-l);color:#a83232}
.q-explain{margin-top:12px;background:#fffbeb;border:1px solid #f5e0a3;border-radius:10px;padding:13px 16px;font-size:13.5px;color:#7a6215}
.q-explain b{display:block;margin-bottom:4px}
.score-band{background:var(--card);border-radius:var(--rad);box-shadow:var(--shadow);padding:26px 30px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-bottom:22px}
.score-num{font-size:44px;font-weight:800;line-height:1}
.score-num small{font-size:15px;color:var(--tx3);font-weight:500}
.score-num.pass{color:var(--ok)}
.score-num.fail{color:var(--err)}
.score-verdict{font-size:16px;font-weight:700}
.score-verdict.pass{color:var(--ok)}
.score-verdict.fail{color:var(--err)}

/* ---------- 联系我们 ---------- */
.contact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ct-card{padding:24px;display:block;transition:.2s}
.ct-card:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.ct-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:21px;color:#fff;margin-bottom:14px}
.ico-wa{background:#25a05a}.ico-em{background:#12507a}.ico-wx{background:#1aad19}.ico-ph{background:#5a6b7a}.ico-ad{background:#8850d4}.ico-hr{background:#ff7a1a}
.ct-card b{display:block;font-size:15px;color:var(--pri-d);margin-bottom:6px}
.ct-card p{font-size:13.5px;color:var(--tx2);white-space:pre-wrap;word-break:break-all}
.form-card{padding:28px;margin-top:26px}
.form-card h3{font-size:16px;color:var(--pri-d);margin-bottom:14px}
.form-row{margin-bottom:14px}
.form-tip{font-size:12.5px;color:var(--tx3);margin:10px 0 16px}

/* ---------- 页脚 ---------- */
#site-footer{background:var(--pri-d);color:#c9d8e4;margin-top:70px}
.ft{display:grid;grid-template-columns:2fr 1fr 1.4fr;gap:40px;padding:46px 0 34px}
.ft h4{color:#fff;font-size:15px;margin-bottom:14px;letter-spacing:.5px}
.ft p{font-size:13px;line-height:1.8}
.ft a{display:block;font-size:13px;padding:3px 0;color:#c9d8e4}
.ft a:hover{color:#fff}
.ft-brand{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.ft-brand .brand-mark{background:var(--acc)}
.ft-links{display:flex;gap:16px}
.ft-links div{flex:1}
.ft-bottom{border-top:1px solid rgba(255,255,255,.12);padding:16px 0 22px;font-size:12px;opacity:.75;text-align:center;line-height:1.8}

/* ---------- 响应式 ---------- */
@media (max-width:1000px){
  .why-grid{grid-template-columns:repeat(2,1fr)}
  .grid-prod{grid-template-columns:repeat(3,1fr)}
  .cat-grid{grid-template-columns:repeat(3,1fr)}
  .cap-grid{grid-template-columns:repeat(3,1fr)}
  .rel-grid{grid-template-columns:repeat(2,1fr)}
  .course-grid,.quiz-grid,.contact-grid{grid-template-columns:repeat(2,1fr)}
  .pd{grid-template-columns:1fr}
  .ft{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .nav{position:fixed;top:65px;left:0;right:0;background:#fff;flex-direction:column;padding:12px 20px 18px;box-shadow:0 10px 24px rgba(16,42,67,.15);display:none;border-bottom:1px solid var(--line)}
  .nav.open{display:flex}
  .nav a{padding:11px 14px}
  .burger{display:flex}
  .hero-in{padding:48px 0 40px}
  .hero h1{font-size:27px}
  .stats{flex-wrap:wrap}
  .stat{flex:1 1 40%}
  .grid-prod{grid-template-columns:repeat(2,1fr);gap:12px}
  .cat-grid,.why-grid,.cap-grid,.course-grid,.quiz-grid,.contact-grid,.rel-grid{grid-template-columns:1fr 1fr}
  .sec{padding:40px 0}
  .cta-band{padding:26px 22px}
  .ft{grid-template-columns:1fr;gap:26px}
  .pd{padding:20px}
  .cd-head{padding:22px}
}
@media (max-width:460px){
  .cat-grid,.cap-grid{grid-template-columns:1fr 1fr}
  .grid-prod{grid-template-columns:1fr 1fr}

  .pprice b{font-size:15px}
}

le","stem":"以下哪些属于出口常见的产品认证要求？（多选）","options":["CE（欧盟）","FCC（美国）","RoHS（有害物质）","CCC（中国强制）"],"answer":[0,1,2],"explanation":"CE/FCC/RoHS 是出口欧盟、美国等市场的常见认证；CCC 是中国国内市场准入认证，不属于出口常见要求。","score":10},{"id":"Q5","type":"judge","stem":"利润测算时，除头程与平台佣金外，还应把推广费与退货率计入成本。","options":["正确","错误"],"answer":[0],"explanation":"完整的利润测算应包含：采购+头程+平台佣金+推广+退货损耗+汇损，漏算推广与退货是新手亏本的常见原因。","score":10},{"id":"Q6","type":"judge","stem":"备货周期与回款周期匹配不重要，只要产品卖得动就行。","options":["正确","错误"],"answer":[1],"explanation":"现金流断裂是电商死亡的常见原因：备货占款周期长而回款慢，会造成资金链断裂，必须让两个周期匹配并预留缓冲。","score":10}]},{"id":"QZ002","title":"亚马逊运营实战测验","title_en":"Amazon Operations Quiz","course_id":"C002","pass_score":60,"time_limit_min":15,"questions":[{"id":"Q1","type":"single","stem":"Listing 关键词体系中，「核心词/长尾词/竞品ASIN词」的正确关系是？","options":["三者互不相关，各埋各的","长尾词流量一定比核心词大","核心词保流量底盘，长尾词捡精准流量，竞品词做拦截","只用核心词，其他都不要"],"answer":[2],"explanation":"关键词三层结构：核心词承载主要流量底盘，长尾词精准转化，竞品 ASIN 词用于广告拦截与流量收割。","score":10},{"id":"Q2","type":"single","stem":"判断主图好坏最直接的指标是？","options":["图片文件大小","主图点击率（CTR）","PS 图层数量","上传时间"],"answer":[1],"explanation":"主图直接决定搜索结果页的点击率（CTR），是验证主图优劣最直接的量化指标。","score":10},{"id":"Q3","type":"single","stem":"某产品售价 $25，扣除头程、佣金等变动成本后毛利 $10，广告可承受的最大 ACOS 约为？","options":["10%","40%","70%","100%"],"answer":[1],"explanation":"盈亏平衡 ACOS ≈ 毛利/售价 = 10/25 = 40%。超过 40% 意味着广告费用吃掉全部毛利，开始亏损（不含固定成本）。","score":10},{"id":"Q4","type":"multiple","stem":"广告周复盘应重点处理的动作包括？（多选）","options":["否定长期无转化且无关的搜索词","对高转化关键词提高 Bid 抢排名","删除所有出单的老关键词","按 ACOS 目标调整预算分配"],"answer":[0,1,3],"explanation":"复盘常规动作：否定无效词、加价抢高转化词、按 ACOS 目标调预算。老关键词已出单说明有效，删除会损失存量流量。","score":10},{"id":"Q5","type":"judge","stem":"TACOS（总广告销售占比）分母是全店销售额，因此更适合衡量广告对整体生意的健康度。","options":["正确","错误"],"answer":[0],"explanation":"TACOS = 广告花费 ÷ 总销售额，能反映广告对自然流量的带动；ACOS 只看广告单，TACOS 更适合评估整体健康度。","score":10},{"id":"Q6","type":"judge","stem":"广告报表里只要某个词有曝光，就应该保留并加预算。","options":["正确","错误"],"answer":[1],"explanation":"只看曝光不看转化会浪费预算：有曝光但长期无点击/无转化的词应降低竞价或否定，预算应向高转化词集中。","score":10}]},{"id":"QZ003","title":"东南亚合规与税务测验","title_en":"SEA Compliance & Tax Quiz","course_id":"C003","pass_score":60,"time_limit_min":15,"questions":[{"id":"Q1","type":"single","stem":"马来西亚对 ≤500 令吉的低价值进口商品征收的 LVG 税率是？","options":["5%","10%","15%","免税"],"answer":[1],"explanation":"马来西亚自 2024 年起对 ≤500 令吉的低价值商品（LVG）征收 10% 销售税，由平台/卖家代收代缴。","score":10},{"id":"Q2","type":"single","stem":"新加坡对进口低价值商品征收 GST 的现行税率是？","options":["7%","8%","9%","12%"],"answer":[2],"explanation":"新加坡 GST 已于 2024 年上调至 9%，进口低价值商品（≤400 新币）由海外卖家注册后代收代缴。","score":10},{"id":"Q3","type":"single","stem":"印尼对跨境直邮包裹设置的价格门槛是？","options":["最低 50 美元","最低 75 美元","最低 100 美元","最低 150 美元"],"answer":[2],"explanation":"印尼将部分品类进口最低门槛设为 100 美元/件，低于该值的商品不得作为特定品类直邮进入，需走正面清单与合规渠道。","score":10},{"id":"Q4","type":"multiple","stem":"关于越南与菲律宾的电商税，以下正确的有？（多选）","options":["越南自 2025 年起取消跨境小包增值税免税","菲律宾数字平台需代扣代缴 12% VAT","越南仍然对所有小包免税","菲律宾 VAT 税率为 5%"],"answer":[0,1],"explanation":"越南自 2025 年起取消小额进口商品增值税免税，按标准税率征收；菲律宾要求数字平台代扣代缴 12% VAT。C、D 均错误。","score":10},{"id":"Q5","type":"judge","stem":"平台已代扣代缴税款的情况下，卖家无需再关注自身注册与申报义务。","options":["正确","错误"],"answer":[1],"explanation":"平台代扣只覆盖平台内销售部分；达到注册门槛（如营业额标准）时，卖家仍有注册税号与申报义务，且自建站（独立站）销售通常需自行申报。","score":10},{"id":"Q6","type":"judge","stem":"面向东南亚市场的定价，应把「到岸成本+税负+平台费+利润」整体测算，而不是只按国内售价乘系数。","options":["正确","错误"],"answer":[0],"explanation":"各国税负与平台费率差异大（如 LVG 10%、GST 9%、VAT 12%），简单乘系数会导致亏本或税务风险，必须按目的国成本结构逐项测算。","score":10}]}]};</script>
<script>/* ============ 环球优选 · 前端应用（无外部依赖，hash 路由） ============ */
'use strict';
var D = window.__DATA__;
var CFG = D.config;
var I18N = CFG.i18n;
var LANG = localStorage.getItem('cbp_lang') || 'zh';
var state = {
  products: { cat: '', sub: '', q: '', sort: 'default', page: 1 },
  coursesLevel: '',
  quiz: null, answers: {}, submitted: false,
  refocusSearch: false
};

/* ---------- i18n ---------- */
function t(k) {
  var d = I18N[LANG] || I18N.zh;
  if (d[k] != null) return d[k];
  if (I18N.zh[k] != null) return I18N.zh[k];
  return k;
}
function fmt(k, vars) {
  var s = t(k);
  for (var key in vars) s = s.replace('{' + key + '}', vars[key]);
  return s;
}
function ct(obj, f) { /* 内容字段：zh 为主，英文缺失回退中文 */
  if (!obj) return '';
  var v = obj[f + '_' + LANG];
  if (v) return v;
  return obj[f] != null ? obj[f] : '';
}
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ---------- 工具 ---------- */
function prodImg(p, idx) {
  idx = idx || 0;
  if (p.images && p.images.length && p.images[idx]) return p.images[idx];
  return 'img/products/' + encodeURIComponent(p.sku) + '.svg';
}
function imgFallback(el) {
  el.onerror = null;
  el.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' fill='%23e8f1f8'/%3E%3Ctext x='40' y='44' text-anchor='middle' font-size='30'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E";
}
function priceTxt(p) {
  if (p.price == null) return t('inquiry');
  return 'US$' + Number(p.price).toFixed(2);
}
function waLink(msg) {
  return 'https://wa.me/' + CFG.contact.whatsapp + '?text=' + encodeURIComponent(msg);
}
function mailLink(subject, body) {
  return 'mailto:' + CFG.contact.email + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
}
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._tm);
  el._tm = setTimeout(function () { el.classList.remove('show'); }, 1600);
}
function copyText(s) {
  if (navigator.clipboard) navigator.clipboard.writeText(s).then(function(){ toast(t('tip_copy') + ': ' + s); });
  else toast(s);
}
function cats() {
  var m = {}, order = [];
  D.products.forEach(function (p) {
    if (!m[p.category]) { m[p.category] = { name: p.category, count: 0, subs: {} }; order.push(p.category); }
    m[p.category].count++;
    if (p.sub_category) m[p.category].subs[p.sub_category] = (m[p.category].subs[p.sub_category] || 0) + 1;
  });
  order.sort(function (a, b) { return m[b].count - m[a].count; });
  return order.map(function (n) { return m[n]; });
}
function quizBest(id) {
  var v = localStorage.getItem('cbp_best_' + id);
  return v == null ? null : Number(v);
}

/* ---------- 路由 ---------- */
function parseRoute() {
  var h = location.hash.replace(/^#\/?/, '');
  var parts = h.split('/').filter(Boolean);
  if (!parts.length) return { name: 'home' };
  switch (parts[0]) {
    case 'products': return { name: 'products' };
    case 'p': return { name: 'product', sku: decodeURIComponent(parts.slice(1).join('/')) };
    case 'about': return { name: 'about' };
    case 'courses': return { name: 'courses' };
    case 'c': return { name: 'course', id: parts[1] };
    case 'quiz': return parts[1] ? { name: 'quizRun', id: parts[1] } : { name: 'quizList' };
    case 'contact': return { name: 'contact' };
    default: return { name: 'home' };
  }
}
function go(hash) {
  if (location.hash === hash) render(); else location.hash = hash;
}
var ROUTE_ACTIVE = { home: 'nav_home', products: 'nav_products', product: 'nav_products', about: 'nav_about', courses: 'nav_courses', course: 'nav_courses', quizList: 'nav_quiz', quizRun: 'nav_quiz', contact: 'nav_contact' };

/* ---------- 骨架 ---------- */
function renderChrome() {
  var route = parseRoute();
  var act = ROUTE_ACTIVE[route.name] || '';
  var navItems = ['nav_home', 'nav_products', 'nav_courses', 'nav_quiz', 'nav_about', 'nav_contact'];
  var navHash = { nav_home: '#/', nav_products: '#/products', nav_courses: '#/courses', nav_quiz: '#/quiz', nav_about: '#/about', nav_contact: '#/contact' };
  var ann = ct(CFG.site, 'announcement');
  var brandName = LANG === 'en' && CFG.site.name_en ? CFG.site.name_en : CFG.site.name;
  var brandTag = ct(CFG.site, 'tagline');
  document.getElementById('announce').innerHTML = ann ? esc(ann) : '';
  document.getElementById('site-header').innerHTML =
    '<div class="wrap hd">' +
    '<a class="brand" href="#/"><span class="brand-mark"></span><span class="brand-name">' + esc(brandName) + '<small>' + esc(CFG.site.logo_text || '') + '</small></span></a>' +
    '<nav class="nav" id="mainnav">' +
    navItems.map(function (k) {
      return '<a href="' + navHash[k] + '" class="' + (k === act ? 'on' : '') + '">' + esc(t(k)) + '</a>';
    }).join('') +
    '</nav>' +
    '<div class="hd-r">' +
    '<button class="lang-btn" onclick="setLang(\'' + (LANG === 'zh' ? 'en' : 'zh') + '\')">' + (LANG === 'zh' ? 'EN' : '中文') + '</button>' +
    '<button class="burger" onclick="toggleMenu()" aria-label="menu">☰</button>' +
    '</div></div>';
  var wa = CFG.contact;
  document.getElementById('site-footer').innerHTML =
    '<div class="wrap ft">' +
    '<div>' +
    '<div class="ft-brand"><span class="brand-mark"></span><b style="color:#fff;font-size:16px">' + esc(brandName) + '</b></div>' +
    '<p>' + esc(t('footer_about')) + '</p>' +
    '<p style="margin-top:10px;opacity:.8">' + esc(brandTag) + '</p>' +
    '</div>' +
    '<div><h4>' + esc(t('footer_links')) + '</h4><div class="ft-links">' +
    '<div>' + navItems.slice(0, 3).map(function (k) { return '<a href="' + navHash[k] + '">' + esc(t(k)) + '</a>'; }).join('') + '</div>' +
    '<div>' + navItems.slice(3).map(function (k) { return '<a href="' + navHash[k] + '">' + esc(t(k)) + '</a>'; }).join('') + '</div>' +
    '</div></div>' +
    '<div><h4>' + esc(t('footer_contact')) + '</h4>' +

/* ---------- 视图：产品目录 ---------- */
function filteredProducts() {
  var st = state.products;
  var list = D.products.slice();
  if (st.cat) list = list.filter(function (p) { return p.category === st.cat; });
  if (st.sub) list = list.filter(function (p) { return p.sub_category === st.sub; });
  if (st.q) {
    var q = st.q.toLowerCase();
    list = list.filter(function (p) {
      var hay = (ct(p, 'name') + ' ' + (p.name_en || '') + ' ' + p.sku + ' ' + (p.tags || []).join(' ') + ' ' + (p.summary || '')).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
  }
  if (st.sort === 'price_asc') list.sort(function (a, b) { return (a.price || 0) - (b.price || 0); });
  else if (st.sort === 'price_desc') list.sort(function (a, b) { return (b.price || 0) - (a.price || 0); });
  return list;
}
function viewProducts() {
  var st = state.products;
  var catList = cats();
  var list = filteredProducts();
  var per = CFG.build.products_per_page || 12;
  var pages = Math.max(1, Math.ceil(list.length / per));
  if (st.page > pages) st.page = pages;
  var pageList = list.slice((st.page - 1) * per, st.page * per);
  var curCat = catList.filter(function (c) { return c.name === st.cat; })[0];
  var subHtml = '';
  if (curCat) {
    var subs = Object.keys(curCat.subs);
    subHtml = '<div class="chips-row"><span class="chip ' + (!st.sub ? 'on' : '') + '" onclick="pSet(\'sub\',\'\')">' + esc(t('all_sub')) + '</span>' +
      subs.map(function (s) {
        return '<span class="chip ' + (st.sub === s ? 'on' : '') + '" onclick="pSet(\'sub\',\'' + esc(s) + '\')">' + esc(s) + ' (' + curCat.subs[s] + ')</span>';
      }).join('') + '</div>';
  }
  var pagerHtml = '';
  if (pages > 1) {
    pagerHtml = '<div class="pager">';
    pagerHtml += '<button ' + (st.page === 1 ? 'disabled' : '') + ' onclick="goPage(' + (st.page - 1) + ')">‹</button>';
    for (var i = 1; i <= pages; i++) {
      if (pages > 9 && i > 2 && i < pages - 1 && Math.abs(i - st.page) > 1) {
        if (i === 3) pagerHtml += '<span style="align-self:center;color:var(--tx3)">…</span>';
        continue;
      }
      pagerHtml += '<button class="' + (i === st.page ? 'on' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }
    pagerHtml += '<button ' + (st.page === pages ? 'disabled' : '') + ' onclick="goPage(' + (st.page + 1) + ')">›</button></div>';
  }
  return '<section class="page-head"><div class="wrap"><h1>' + esc(t('prod_title')) + '</h1><p>' + esc(t('prod_sub')) + '</p></div></section>' +
    '<section class="sec" style="padding-top:30px"><div class="wrap">' +
    '<div class="toolbar">' +
    '<div class="search-box"><input type="text" id="prodSearch" placeholder="' + esc(t('search_ph')) + '" value="' + esc(st.q) + '" oninput="pSearch(event)"></div>' +
    '<select class="sort-sel" onchange="pSet(\'sort\',this.value)">' +
    '<option value="default"' + (st.sort === 'default' ? ' selected' : '') + '>' + esc(t('sort_default')) + '</option>' +
    '<option value="price_asc"' + (st.sort === 'price_asc' ? ' selected' : '') + '>' + esc(t('sort_price_asc')) + '</option>' +
    '<option value="price_desc"' + (st.sort === 'price_desc' ? ' selected' : '') + '>' + esc(t('sort_price_desc')) + '</option>' +
    '</select>' +
    '<span style="font-size:13.5px;color:var(--tx3)">' + esc(fmt('results_count', { n: list.length })) + '</span>' +
    '</div>' +
    '<div class="chips-row"><span class="chip ' + (!st.cat ? 'on' : '') + '" onclick="pSet(\'cat\',\'\')">' + esc(t('all_cat')) + ' (' + D.products.length + ')</span>' +
    catList.map(function (c) {
      return '<span class="chip ' + (st.cat === c.name ? 'on' : '') + '" onclick="pSet(\'cat\',\'' + esc(c.name) + '\')">' + esc(c.name) + ' (' + c.count + ')</span>';
    }).join('') + '</div>' +
    subHtml +
    (pageList.length ? '<div class="grid-prod">' + pageList.map(prodCard).join('') + '</div>'
      : '<div class="no-result">📦 ' + esc(t('empty_result')) + '</div>') +
    pagerHtml +
    '</div></section>';
}
function pSet(k, v) {
  state.products[k] = v;
  if (k !== 'page') state.products.page = 1;
  render();
}
function goPage(n) {
  state.products.page = n;

function pSearch(e) {

    '<span class="tag" style="background:var(--bg);color:var(--tx2)">📚 ' + (c.chapters || []).length + ' ' + esc(t('chapters_label')) + '</span>' +
    '<span class="tag" style="background:var(--bg);color:var(--tx2)">⏱ ' + courseTotalMin(c) + ' ' + esc(t('minutes')) + '</span></div>' +
    (c.audience ? '<p style="font-size:13.5px;color:var(--tx2);margin-top:6px"><b>' + esc(t('audience_label')) + '：</b>' + esc(ct(c, 'audience') || c.audience) + '</p>' : '') +
    '</div>' +
    (qz ? '<a class="btn btn-pri" href="#/quiz/' + esc(qz.id) + '">📝 ' + esc(t('quiz_btn')) + '</a>' : '') +
    '</div>' +
    '<h2 style="font-size:19px;color:var(--pri-d);margin:28px 0 16px">' + esc(t('outline_title')) + '</h2>' +
    (c.chapters || []).map(function (ch, idx) {
      return '<div class="chapter card">' +
        '<div class="ch-title"><span class="ch-no">' + ch.no + '</span><b>' + esc(ct(ch, 'title') || ch.title) + '</b><span class="ch-dur">⏱ ' + (ch.duration_min || 0) + ' ' + esc(t('minutes')) + '</span></div>' +
        '<div class="video-ph"><div class="vp-play">▶</div><b>' + esc(t('video_ph')) + '</b><span>' + esc(t('video_ph_note')) + '</span></div>' +
        ((ch.points || []).length ? '<div class="ch-points"><b>' + esc(t('points_label')) + '</b><ul>' +
          ch.points.map(function (pt) { return '<li>' + esc(pt) + '</li>'; }).join('') + '</ul></div>' : '') +
        '</div>';
    }).join('') +
    (qz ? '<div class="quiz-cta"><span>📝 ' + esc(t('quiz_cta')) + '</span><a class="btn btn-pri" href="#/quiz/' + esc(qz.id) + '">' + esc(t('start_quiz')) + ' →</a></div>' : '') +
    '<div style="margin-top:26px"><a class="btn btn-ghost" href="#/courses">← ' + esc(t('back_courses')) + '</a></div>' +
    '</div></section>';
}

/* ---------- 视图：测验 ---------- */
function quizTypeLabel(ty) {
  if (ty === 'single') return t('single');
  if (ty === 'multiple') return t('multiple');
  return t('judge');
}
function viewQuizList() {
  var cards = D.quizzes.map(function (q) {
    var c = D.courses.filter(function (x) { return x.id === q.course_id; })[0];
    var best = quizBest(q.id);
    return '<div class="qcard card">' +
      (c ? '<div class="ccard-top"><span class="tag">' + esc(ct(c, 'title')) + '</span></div>' : '') +
      '<h3>' + esc(ct(q, 'title') || q.title) + '</h3>' +
      '<div class="qmeta">📝 ' + esc(fmt('q_count', { n: (q.questions || []).length })) + ' · ⏱ ' + esc(fmt('time_limit', { m: q.time_limit_min || '-' })) +
      ' · 🎯 ' + esc(LANG === 'en' ? 'Pass' : '及格') + ' ' + q.pass_score + '</div>' +
      '<div class="qbest">' + esc(t('best_score')) + ': ' + (best == null ? esc(t('no_attempt')) : best + '') + '</div>' +
      '<a class="btn btn-pri btn-sm" style="align-self:flex-start" href="#/quiz/' + esc(q.id) + '">' + esc(t('start_quiz')) + ' →</a>' +
      '</div>';
  }).join('');
  return '<section class="page-head"><div class="wrap"><h1>' + esc(t('quiz_title')) + '</h1><p>' + esc(t('quiz_sub')) + '</p></div></section>' +
    '<section class="sec"><div class="wrap"><div class="quiz-grid">' + cards + '</div></div></section>';
}
function answersEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  var x = a.slice().sort(), y = b.slice().sort();
  for (var i = 0; i < x.length; i++) if (x[i] !== y[i]) return false;
  return true;
}
function viewQuizRun(id) {
  if (!state.quiz || state.quiz.id !== id) {
    var q = D.quizzes.filter(function (x) { return x.id === id; })[0];
    if (!q) return '<div class="no-result">404 · ' + esc(id) + '</div>';
    state.quiz = q; state.answers = {}; state.submitted = false;
  }
  var q = state.quiz;
  var answered = (q.questions || []).filter(function (qq, i) { return state.answers[i] && state.answers[i].length; }).length;
  var head;
  if (state.submitted) {
    var total = q.questions.reduce(function (s, qq) { return s + (qq.score || 0); }, 0);
    var score = q.questions.reduce(function (s, qq, i) {
      return s + (answersEqual(state.answers[i], qq.answer) ? (qq.score || 0) : 0);
    }, 0);
    var pct = total ? Math.round(score / total * 100) : 0;
    var passed = pct >= (q.pass_score || CFG.build.default_pass_score || 60);
    if (quizBest(q.id) == null || pct > quizBest(q.id)) localStorage.setItem('cbp_best_' + q.id, pct);
    head = '<div class="score-band">' +
      '<div class="score-num ' + (passed ? 'pass' : 'fail') + '">' + pct + '<small>%</small></div>' +
      '<div style="flex:1;min-width:180px"><div class="score-verdict ' + (passed ? 'pass' : 'fail') + '">' + (passed ? '🎉 ' + esc(t('pass_label')) : '💪 ' + esc(t('fail_label'))) + '</div>' +
      '<div style="font-size:13px;color:var(--tx3);margin-top:4px">' + esc(t('your_score')) + ': ' + score + ' / ' + total + ' · ' + esc(LANG === 'en' ? 'Pass line' : '及格线') + ' ' + (q.pass_score || 60) + '%</div></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-pri" onclick="retakeQuiz()">' + esc(t('retake')) + '</button>' +
      '<a class="btn btn-ghost" href="#/quiz">' + esc(t('back_quiz_list')) + '</a></div>' +
      '</div>';
  } else {
    head = '<div class="qrun-head"><h1>' + esc(ct(q, 'title') || q.title) + '</h1>' +
      '<div class="qprog">' + esc(LANG === 'en' ? 'Answered' : '已答') + ' <b>' + answered + '</b> / ' + q.questions.length +
      ' · <a href="#/quiz" style="color:var(--tx3)">' + esc(t('back_quiz_list')) + '</a></div>' +
      '<button class="btn btn-pri" onclick="submitQuiz()">' + esc(t('submit_quiz')) + '</button></div>';
  }
  var body = (q.questions || []).map(function (qq, i) {
    var sel = state.answers[i] || [];
    var typeCls = qq.type === 'multiple' ? 'mul' : (qq.type === 'judge' ? 'jud' : '');
    var opts = (qq.options || []).map(function (op, oi) {
      var isSel = sel.indexOf(oi) !== -1;
      var inAnswer = (qq.answer || []).indexOf(oi) !== -1;
      var cls = isSel ? 'opt sel' : 'opt';
      if (state.submitted) {
        if (inAnswer) cls = 'opt correct';
        else if (isSel) cls = 'opt wrong';
      }
      var click = qq.type === 'multiple' ? 'pickMul(' + i + ',' + oi + ')' : 'pickOne(' + i + ',' + oi + ')';
      return '<button class="' + cls + '" ' + (state.submitted ? 'disabled' : 'onclick="' + click + '"') + '>' +
        '<span class="opt-key">' + String.fromCharCode(65 + oi) + '</span><span>' + esc(op) + '</span></button>';
    }).join('');
    var review = '';
    if (state.submitted) {
      var ansTxt = (qq.answer || []).map(function (ai) { return String.fromCharCode(65 + ai) + '. ' + (qq.options || [])[ai]; }).join('；');
      var yourTxt = sel.length ? sel.map(function (ai) { return String.fromCharCode(65 + ai) + '. ' + (qq.options || [])[ai]; }).join('；') : t('no_answer');
      review = '<div class="q-explain"><b>' + esc(t('correct_answer')) + '：' + esc(ansTxt) + '　|　' + esc(t('your_answer')) + '：' + esc(yourTxt) + '</b>' +
        (qq.explanation ? '💡 ' + esc(qq.explanation) : '') + '</div>';
    }
    return '<div class="qcard-q card" id="q-' + i + '">' +
      '<div class="qstem"><span class="qtype ' + typeCls + '">' + esc(quizTypeLabel(qq.type)) + '</span>' +
      '<b>' + esc(fmt('q_of', { i: i + 1, n: q.questions.length })) + '　' + esc(qq.stem) + '</b></div>' +
      '<div class="opts">' + opts + '</div>' + review + '</div>';
  }).join('');
  return '<section class="sec" style="padding-top:26px"><div class="wrap" style="max-width:860px">' +
    head + body +
    (!state.submitted ? '<div style="text-align:center;margin-top:24px"><button class="btn btn-pri" onclick="submitQuiz()" style="padding:13px 42px">' + esc(t('submit_quiz')) + '</button></div>' : '') +
    '</div></section>';
}
function pickOne(qi, oi) {
  state.answers[qi] = [oi];
  renderQuizSoft(qi);
}
function pickMul(qi, oi) {
  var arr = state.answers[qi] || [];
  var ix = arr.indexOf(oi);
  if (ix === -1) arr.push(oi); else arr.splice(ix, 1);
  state.answers[qi] = arr;
  renderQuizSoft(qi);
}
function renderQuizSoft() {
  render();
  var q = state.quiz;
  if (q) {
    var el = document.getElementById('q-0');
    if (el && !window._keepScroll) window.scrollTo(0, 0);
  }
}
function submitQuiz() {
  var q = state.quiz;
  if (!q) return;
  var unanswered = (q.questions || []).filter(function (qq, i) { return !state.answers[i] || !state.answers[i].length; }).length;
  if (unanswered > 0 && !confirm(fmt('confirm_submit', { n: unanswered }))) return;
  state.submitted = true;
  render();
  window.scrollTo({ top: 0 });
}
function retakeQuiz() {
  state.answers = {};
  state.submitted = false;
  render();
  window.scrollTo({ top: 0 });
}

/* ---------- 视图：联系我们 ---------- */
function viewContact() {
  var wa = CFG.contact;
  var waMsg = LANG === 'en' ? 'Hello, I have an inquiry about sourcing.' : '您好，我想咨询选品与报价。';
  return '<section class="page-head"><div class="wrap"><h1>' + esc(t('contact_title')) + '</h1><p>' + esc(t('contact_sub')) + '</p></div></section>' +
    '<section class="sec"><div class="wrap">' +
    '<div class="contact-grid">' +
    '<a class="ct-card card" target="_blank" rel="noopener" href="' + esc(waLink(waMsg)) + '"><div class="ct-ico ico-wa">💬</div><b>' + esc(t('w_label')) + '</b><p>' + esc(wa.whatsapp_display) + '<br>' + esc(t('w_desc')) + '</p></a>' +
    '<a class="ct-card card" href="' + esc(mailLink((LANG === 'en' ? 'Inquiry from website' : '网站询盘'), '')) + '"><div class="ct-ico ico-em">✉</div><b>' + esc(t('e_label')) + '</b><p>' + esc(wa.email) + '<br>' + esc(t('e_desc')) + '</p></a>' +
    '<div class="ct-card card"><div class="ct-ico ico-wx">🟢</div><b>' + esc(t('wechat_label')) + '</b><p>' + esc(wa.wechat) + '</p></div>' +
    '<div class="ct-card card"><div class="ct-ico ico-ph">📞</div><b>' + esc(t('phone_label')) + '</b><p>' + esc(wa.phone) + '</p></div>' +
    '<div class="ct-card card"><div class="ct-ico ico-ad">📍</div><b>' + esc(t('addr_label')) + '</b><p>' + esc(wa.address) + '</p></div>' +
    '<div class="ct-card card"><div class="ct-ico ico-hr">🕘</div><b>' + esc(t('hours_label')) + '</b><p>' + esc(LANG === 'en' && wa.hours_en ? wa.hours_en : wa.hours) + '</p></div>' +
    '</div>' +
    '<div class="form-card card">' +
    '<h3>' + esc(t('form_title')) + '</h3>' +
    '<div class="form-row"><input type="text" id="cfName" placeholder="' + esc(t('form_name')) + '"></div>' +
    '<div class="form-row"><textarea id="cfMsg" rows="4" placeholder="' + esc(t('form_msg')) + '"></textarea></div>' +
    '<p class="form-tip">' + esc(t('form_tip')) + '</p>' +
    '<button class="btn btn-pri-l" onclick="sendForm()">✉ ' + esc(t('form_send')) + '</button>' +
    '</div>' +
    '</div></section>';
}
function sendForm() {
  var n = document.getElementById('cfName').value || '-';
  var m = document.getElementById('cfMsg').value || '-';
  location.href = mailLink((LANG === 'en' ? 'Website inquiry from ' : '网站询盘来自 ') + n, m);
}

/* ---------- 主渲染 ---------- */
function render() {
  var route = parseRoute();
  var html;
  switch (route.name) {
    case 'products': html = viewProducts(); break;
    case 'product': html = viewProduct(route.sku); break;
    case 'about': html = viewAbout(); break;
    case 'courses': html = viewCourses(); break;
    case 'course': html = viewCourse(route.id); break;
    case 'quizList': html = viewQuizList(); break;
    case 'quizRun': html = viewQuizRun(route.id); break;
    case 'contact': html = viewContact(); break;
    default: html = viewHome();
  }
  renderChrome();
  document.getElementById('app').innerHTML = html;
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-CN';
  if (state.refocusSearch) {
    state.refocusSearch = false;
    var inp = document.getElementById('prodSearch');
    if (inp) { inp.focus(); var v = inp.value; inp.setSelectionRange(v.length, v.length); }
  }
}
window.addEventListener('hashchange', function () {
  document.getElementById('mainnav') && document.getElementById('mainnav').classList.remove('open');
  render();
  window.scrollTo({ top: 0 });
});
render();
</script>
